name: CI

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: production
          platforms: linux/amd64
          load: true
          tags: rancher/fluent-bit:test-prod
          cache-from: type=gha,scope=linux-amd64-production
          cache-to: type=gha,mode=max,scope=linux-amd64-production

      - name: Smoke test production image
        run: |
          docker run --rm rancher/fluent-bit:test-prod --version
          docker run --rm rancher/fluent-bit:test-prod --dry-run -c /fluent-bit/etc/fluent-bit.conf
