name: CI

on:
  workflow_call:
    inputs:
      target:
        type: string
        default: 'production'
        description: 'Docker target to build and test'
  workflow_dispatch:
    inputs:
      target:
        type: string
        default: 'production'
        description: 'Docker target to build and test'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - 'CODEOWNERS'
      - 'LICENSE'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: ${{ inputs.target || 'production' }}
          platforms: linux/amd64
          load: true
          tags: rancher/fluent-bit:test
          cache-from: type=gha,scope=linux-amd64-${{ inputs.target || 'production' }}
          cache-to: type=gha,mode=max,scope=linux-amd64-${{ inputs.target || 'production' }}

      - name: Smoke test image
        run: |
          TARGET="${{ inputs.target || 'production' }}"
          if [[ "$TARGET" == "debug" ]]; then
            docker run --entrypoint /fluent-bit/bin/fluent-bit --rm rancher/fluent-bit:test --version
            docker run --entrypoint /fluent-bit/bin/fluent-bit --rm rancher/fluent-bit:test --dry-run -c /fluent-bit/etc/fluent-bit.conf
          else
            docker run --rm rancher/fluent-bit:test --version
            docker run --rm rancher/fluent-bit:test --dry-run -c /fluent-bit/etc/fluent-bit.conf
          fi
